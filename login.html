<!DOCTYPE html>
<html>
<head>
    <title>Login - PeerPulse</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>PeerPulse</h1>
        <p>Learn Together. Teach Together. Grow Together.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Tutors</a>
            <a href="sessions.html">My Sessions</a>
            <a href="profile.html">Your Profile</a>
            <a href="registration.html">Register</a>
        </nav>
    </header>

    <hr>

    <!-- Login Section -->
    <main>
        <section>
            <h2>Welcome Back!</h2>
            <p>Login to continue your learning journey with PeerPulse.</p>

            <form action="#" method="post">

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required>
                </p>

                <button type="submit">Login</button>
                <button type="reset">Clear</button>

            </form>

            <p>Don't have an account?
                <a href="registration.html">Create an Account</a>
            </p>
        </section>
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>© 2026 PeerPulse. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
